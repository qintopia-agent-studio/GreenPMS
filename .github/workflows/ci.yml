name: GreenPMS CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: greenpms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-format:
    name: PR format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Test and validate PR metadata
        run: |
          node --test scripts/check-pr-tests.mjs
          node scripts/check-pr.mjs

  check:
    name: Node and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test release harness
        run: python3 -m unittest discover -s scripts/release/tests -v

  catalog-regression:
    name: Catalog lifecycle regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qintopia
          POSTGRES_PASSWORD: qintopia
          POSTGRES_DB: qintopia
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U qintopia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Maintained catalog lifecycle matrix
        run: npm run test:catalog-regression
      - name: First catalog write, display, failure diagnostics and catalog management
        run: |
          npm run test:integration:lock-runner
          npm run test:catalog-management
